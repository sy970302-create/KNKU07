<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>사자자리 유성우 관측회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1d3a; --cream:#fff6e0; --pink:#ff7eb6; --yellow:#ffd84d; --mint:#6fe3c1;
  --sky:#7cc7ff; --panel:rgba(26,18,48,.82); --line:rgba(255,255,255,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;color:#fff;
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
#css3d,#gl{position:fixed;inset:0}
#css3d{z-index:0;pointer-events:none}
#gl{z-index:1}
#gl canvas{display:block;outline:none}
.hud{position:fixed;z-index:5}
button{font-family:inherit;cursor:pointer}

/* entry */
#entry{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 20%,#3b2a7a 0%,#140f33 55%,#07051a 100%);padding:16px;overflow:auto}
#entry .card{position:relative;width:min(600px,100%);max-height:100%;overflow:auto;background:rgba(255,255,255,.06);border:2px solid var(--line);
  border-radius:28px;padding:24px 22px;text-align:center;backdrop-filter:blur(6px);
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
#entry h1{margin:0 0 16px;font-size:30px;line-height:1.2;color:var(--yellow);text-shadow:0 3px 0 #b2471f}
#entry .big{display:block;width:100%;padding:14px;margin:10px 0;border-radius:18px;border:0;
  font-size:20px;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s}
#entry .big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#entry .guest{background:var(--mint)}
#entry .admin{background:var(--pink)}
#entry input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);
  background:rgba(0,0,0,.3);color:#fff;font-family:inherit;font-size:18px;margin:6px 0;outline:none}
#entry input:focus{border-color:var(--yellow)}
#entry .ghost{background:transparent;border:0;color:#cfc6ff;font-size:15px;margin-top:6px;text-decoration:underline}
#entry .err{color:#ff8f8f;min-height:20px;font-size:15px}
.hidden{display:none!important}
.stars-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.stars-bg i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2s infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}

/* 커마 */
.custom{display:flex;gap:14px;align-items:stretch;margin:8px 0 4px;text-align:left}
.pv{flex:0 0 210px;border-radius:20px;background:radial-gradient(circle at 50% 60%,#4b3a8f,#1c1440 75%);
  border:2px solid var(--line);position:relative;overflow:hidden;min-height:250px}
.pv canvas{width:100%;height:100%;display:block}
.pv .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;opacity:.6}
.opts{flex:1;min-width:0}
.opts .lbl{font-size:15px;margin:6px 0 4px;color:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:2px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:5px 9px;font-size:14px}
.chip.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.25);padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--pink)}
.dice{margin-top:10px;border:0;border-radius:12px;padding:7px 12px;background:var(--yellow);color:var(--ink);font-size:15px}
@media (max-width:520px){.custom{flex-direction:column}.pv{flex-basis:220px}}

/* HUD */
#topLeft{top:12px;left:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:8px 12px;font-size:15px;max-width:min(260px,60vw)}
#topLeft .names{font-size:13px;opacity:.85;margin-top:4px;max-height:30vh;overflow:auto;line-height:1.5}
#bucketHud{bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:8px 16px;font-size:18px;display:flex;gap:10px;align-items:center;white-space:nowrap}
#bucketHud .pc{font-size:24px;transition:transform .2s,opacity .2s}
#bucketHud .pc.off{opacity:.18;filter:grayscale(1)}
#bucketHud .giant{font-size:34px;display:inline-block;animation:wiggle 1s infinite}
#help{bottom:16px;left:12px;font-size:13px;opacity:.8;background:var(--panel);border-radius:14px;padding:8px 10px;
  line-height:1.6;border:1px solid var(--line);max-width:240px}
#toolsR{top:12px;right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pill{background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:14px;padding:8px 12px;font-size:15px}
.vol{display:flex;flex-direction:column;gap:4px}
.vol label{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.vol input[type=range]{width:110px;accent-color:var(--yellow);cursor:pointer}
.vol span{width:28px;text-align:right;font-size:12px;opacity:.8}
#soundBtn.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,.7)}50%{box-shadow:0 0 0 8px rgba(255,216,77,0)}}
#adminPanel{background:rgba(60,18,48,.9);border:2px solid var(--pink);border-radius:18px;padding:10px;width:min(290px,80vw)}
#adminPanel h3{margin:0 0 6px;font-size:16px;color:var(--pink)}
#adminPanel input{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);
  color:#fff;font-family:inherit;font-size:14px;outline:none}
#adminPanel .r{display:flex;gap:6px;margin-top:6px}
#adminPanel .r button{flex:1}
#adminPanel button{border:0;border-radius:10px;padding:8px;font-size:14px;color:var(--ink);background:var(--mint)}
#meteorBtn{width:100%;margin-top:8px;font-size:24px!important;padding:14px!important;
  background:linear-gradient(135deg,#ffd84d,#ff7eb6 60%,#9b6bff)!important;color:#2b1d3a!important;
  box-shadow:0 5px 0 #6b2350;border-radius:16px!important;animation:wiggle 1.6s infinite}
#meteorBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #6b2350}
@keyframes wiggle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
#clearBtn{background:#ffb3b3!important;width:100%;margin-top:6px}
#adminPanel .meta{font-size:12px;opacity:.8;margin-top:6px}

#toast{top:22%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--ink);
  padding:10px 18px;border-radius:18px;font-size:18px;pointer-events:none;opacity:0;transition:opacity .25s;
  box-shadow:0 6px 0 rgba(0,0,0,.25);white-space:nowrap}
#toast.show{opacity:1}

#floaters{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.fl{position:absolute;left:0;top:0;white-space:nowrap;font-size:22px;color:#fff;
  -webkit-text-stroke:5px #2b1d3a;paint-order:stroke fill;will-change:transform,opacity}
#chaos{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.cz{position:absolute;white-space:nowrap;-webkit-text-stroke:6px #2b1d3a;paint-order:stroke fill;
  animation:czIn .45s cubic-bezier(.2,1.8,.4,1) both, czOut .4s ease-in forwards;will-change:transform}
@keyframes czIn{from{transform:translate(-50%,-50%) scale(0) rotate(var(--r))}to{transform:translate(-50%,-50%) scale(1) rotate(var(--r))}}
@keyframes czOut{to{opacity:0;transform:translate(-50%,-90%) scale(1.25) rotate(var(--r))}}
.donation{position:fixed;left:50%;top:12%;z-index:7;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(135deg,#9b6bff,#ff7eb6);border:4px solid #fff;border-radius:22px;padding:12px 26px;
  font-size:clamp(26px,6vw,54px);color:#fff;-webkit-text-stroke:6px #2b1d3a;paint-order:stroke fill;
  box-shadow:0 10px 0 rgba(0,0,0,.3);animation:don 5s ease forwards;white-space:nowrap}
@keyframes don{0%{transform:translateX(-50%) scale(0) rotate(-8deg)}8%{transform:translateX(-50%) scale(1.15) rotate(4deg)}
  12%{transform:translateX(-50%) scale(1) rotate(-2deg)}20%,85%{transform:translateX(-50%) scale(1) rotate(0)}
  50%{transform:translateX(-50%) scale(1.05) rotate(2deg)}100%{transform:translateX(-50%) scale(0) rotate(10deg);opacity:0}}

#joy{left:18px;bottom:90px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.25);touch-action:none}
#joy .k{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.35)}
#jumpBtn{right:18px;bottom:100px;width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  background:rgba(255,216,77,.35);color:#fff;font-size:16px;touch-action:none}
@media (max-width:640px){#help{display:none}#bucketHud{font-size:15px;bottom:10px}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",

<body>
<div id="css3d"></div>
<div id="gl"></div>
<div id="floaters"></div>
<div id="chaos"></div>

<!-- ENTRY -->
<div id="entry">
  <div class="stars-bg" id="entryStars"></div>
  <div class="card">
    <div style="font-size:52px;line-height:1">🦁🍿☄️</div>
    <h1>사자자리 유성우<br>관측회</h1>

    <div id="step1">
      <button class="big guest" id="goGuest">🐾 게스트 입장</button>
      <button class="big admin" id="goAdmin">👑 관리자 입장</button>
    </div>

    <div id="stepForm" class="hidden">
      <div id="pwWrap" class="hidden">
        <input id="pw" type="password" inputmode="numeric" placeholder="관리자 비밀번호" autocomplete="off">
      </div>
      <input id="nick" maxlength="12" placeholder="닉네임 (머리 위에 보여요)" autocomplete="off">
      <div class="custom">
        <div class="pv" id="pvBox"><div class="hint">빙글빙글~ (드래그로 돌리기)</div></div>
        <div class="opts">
          <div class="lbl">갈기</div><div class="chips" id="optMane"></div>
          <div class="lbl">얼굴</div><div class="chips" id="optFace"></div>
          <div class="lbl">갈기 색</div><div class="chips" id="optColor"></div>
          <button class="dice" id="reroll">🎲 랜덤</button>
        </div>
      </div>
      <div class="err" id="err"></div>
      <button class="big guest" id="enterBtn">입장하기!</button>
      <button class="ghost" id="backBtn">← 뒤로</button>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="topLeft" class="hud hidden"><div id="netStatus">🔌 연결 중…</div><div class="names" id="names"></div></div>
<div id="toolsR" class="hud hidden">
  <button class="pill" id="soundBtn">🔊 영상 소리 켜기</button>
  <div class="pill vol">
    <label>🔔 효과음 <input type="range" id="sfxVol" min="0" max="100"><span id="sfxVal"></span></label>
    <label>📺 영상 <input type="range" id="vidVol" min="0" max="100"><span id="vidVal"></span></label>
  </div>
  <div id="adminPanel" class="hidden">
    <h3>👑 관리자 패널</h3>
    <input id="ytInput" placeholder="유튜브 링크 붙여넣기 (라이브 OK)">
    <div class="r"><button id="ytApply">📺 스크린에 띄우기</button><button id="ytOff" style="background:#ddd;flex:.5">끄기</button></div>
    <button id="meteorBtn">☄️ 유성우다!!</button>
    <button id="clearBtn">🧹 별사탕 전체 청소</button>
    <div class="meta" id="adminMeta">별사탕 0개</div>
  </div>
</div>
<div id="bucketHud" class="hud hidden">🍿 팝콘 <span id="pcIcons"></span></div>
<div id="help" class="hud hidden">
  <b>WASD</b> 이동 · <b>Shift</b> 달리기 · <b>Space</b> 점프<br>
  <b>클릭</b> 팝콘 와작와작<br>
  <b>팝콘산 클릭</b> 리필 · <b>별사탕 클릭</b> 숟가락 퍽퍽<br>
  <b>드래그</b> 시점 · <b>휠</b> 줌
</div>
<div id="toast" class="hud"></div>
<div id="joy" class="hud hidden"><div class="k"></div></div>
<button id="jumpBtn" class="hud hidden">점프</button>

<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import * as CANNON from 'cannon-es';

/* ============================================================
   설정
   ============================================================ */
// 공개 무료 MQTT 중계소 두 곳에 동시에 연결 (한 곳이 막혀도 다른 곳으로 만남)
const BROKERS = (new URLSearchParams(location.search).get('broker') || 'wss://broker.emqx.io:8084/mqtt,wss://broker.hivemq.com:8884/mqtt').split(',');
const TOPIC = 'knku07/leonids-dome/v2';
const ADMIN_PW = '7412';
const DOME_R = 26;
const PLAY_R = 22.5;
const SCREEN_W = 18, SCREEN_H = 10.125;
const SCREEN_POS = new THREE.Vector3(0, 7.4, -19.5);
const POPCORN_POS = new THREE.Vector3(-11.5, 0, -13.5);
const POP_H = 5.2, POP_R = 4.2;   // 팝콘산 크기
const CANDY_R = 3.0;              // 별사탕 반지름 (돌기 포함 약 4 → 사자의 5배쯤)
const MAX_HITS = 300;
const LION_R = 0.45;
const REMOTE_H = 1.5;             // 남의 사자 몸 높이 (위에 올라탈 수 있음)
const GIANT_CHANCE = 0.2;         // 개큰 팝콘 확률
const LOOK_UP = 1.8;              // 카메라가 위쪽(하늘)을 보는 정도
// 저사양 모드: 폰이거나 주소 뒤에 ?low 붙이면 그림자·풀 줄임
const LOW = /[?&]low/.test(location.search) || matchMedia('(pointer: coarse)').matches;

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const now = () => Date.now();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ============================================================
   캐릭터 옵션
   ============================================================ */
const MANE_STYLES = ['curly', 'straight', 'wavy', 'silky', 'dread', 'rock', 'bald'];
const MANE_NAMES = { curly: '뽀글이', straight: '쭈뼛 직모', wavy: '웨이브', silky: '찰랑찰랑 직모', dread: '레게', rock: '락스타', bald: '대머리' };
const FACE_COUNT = 5; // 0 화난, 1 슬픈, 2 일반, 3 지토메, 4 콩눈
const MANE_COLORS = ['#e8732c', '#8b4a1f', '#f4b63f', '#ff7eb6', '#9b6bff', '#3fc1c9', '#4a3b52', '#f4f0ea', '#e8433c', '#6fcf5a', '#2d7ff9', '#ffd84d'];
const FURS = ['#f7c46b', '#f2b85a', '#fbd38a', '#eeb877', '#f5c983'];
function randomLook() { return { m: pick(MANE_STYLES), c: pick(MANE_COLORS), f: pick(FURS), e: (Math.random() * FACE_COUNT) | 0 }; }
function fixLook(l) {
  const r = randomLook();
  if (!l || typeof l !== 'object') return r;
  return { m: MANE_STYLES.includes(l.m) ? l.m : r.m, c: typeof l.c === 'string' ? l.c : r.c, f: typeof l.f === 'string' ? l.f : r.f, e: Number.isInteger(l.e) && l.e >= 0 && l.e < FACE_COUNT ? l.e : r.e };
}
let myLook = fixLook(store.get('mtr_look', null));
let isAdmin = false;
let myNick = store.get('mtr_nick', '');

/* ============================================================
   사운드 (WebAudio 합성) – 전체 볼륨 낮춤
   ============================================================ */
let AC = null, master = null, sfxOn = true;
let sfxVol = clamp(+store.get('mtr_sfx', 50) || 0, 0, 100), vidVol = clamp(+store.get('mtr_vid', 70) || 0, 0, 100);
const sfxGain = () => (sfxVol / 100) * 0.46;   // 50 = 예전 소리의 1/3 수준
function audioInit() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = sfxGain(); sfxOn = sfxVol > 0; master.connect(AC.destination);
}
let noiseBuf = null;
function noise() {
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 1.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = AC.createBufferSource(); s.buffer = noiseBuf; return s;
}
function env(g, t, a, peak, d) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
const SFX = {
  crunch(vol = 1) {
    if (!AC || !sfxOn) return;
    const t0 = AC.currentTime;
    const n = 5 + (Math.random() * 4 | 0);
    for (let i = 0; i < n; i++) {
      const t = t0 + i * rand(0.04, 0.08);
      const src = noise(), f = AC.createBiquadFilter(), g = AC.createGain();
      f.type = 'bandpass'; f.frequency.value = rand(1200, 3800); f.Q.value = rand(1, 4);
      src.connect(f); f.connect(g); g.connect(master);
      env(g, t, 0.004, 0.9 * vol, rand(0.03, 0.08));
      src.start(t, Math.random()); src.stop(t + 0.15);
    }
  },
  whack(vol = 1) {
    if (!AC || !sfxOn) return;
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.12);
    o.connect(g); g.connect(master); env(g, t, 0.003, 0.9 * vol, 0.16); o.start(t); o.stop(t + 0.2);
    const o2 = AC.createOscillator(), g2 = AC.createGain();
    o2.type = 'triangle'; o2.frequency.value = rand(1700, 2300);
    o2.connect(g2); g2.connect(master); env(g2, t, 0.002, 0.25 * vol, 0.25); o2.start(t); o2.stop(t + 0.3);
    const s = noise(), f = AC.createBiquadFilter(), g3 = AC.createGain();
    f.type = 'lowpass'; f.frequency.value = 1500; s.connect(f); f.connect(g3); g3.connect(master);
    env(g3, t, 0.002, 0.6 * vol, 0.06); s.start(t); s.stop(t + 0.1);
  },
  whoosh(vol = 1) {
    if (!AC || !sfxOn) return;
    const t = AC.currentTime;
    const s = noise(), f = AC.createBiquadFilter(), g = AC.createGain();
    f.type = 'bandpass'; f.Q.value = 2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2500, t + 1.3);
    s.connect(f); f.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5 * vol, t + 1.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.45);
    s.start(t); s.stop(t + 1.5);
  },
  boom(vol = 1) {
    if (!AC || !sfxOn) return;
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.6);
    o.connect(g); g.connect(master); env(g, t, 0.005, 1.0 * vol, 0.7); o.start(t); o.stop(t + 0.8);

function parseYouTube(url) {
  if (!url) return null;
  url = url.trim();
  if (/^[\w-]{11}$/.test(url)) return url;
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1, 12);
    if (u.searchParams.get('v')) return u.searchParams.get('v').slice(0, 11);
    const m = u.pathname.match(/\/(embed|live|shorts|v)\/([\w-]{11})/);
    if (m) return m[2];
  } catch {}
  return null;
}
let soundOn = false;
function setVideo(url) {
  const id = parseYouTube(url);
  if (ytFrame) { ytFrame.remove(); ytFrame = null; }
  if (!id) { screenPlaceholder.visible = true; $('soundBtn').classList.add('hidden'); return; }
  const origin = location.origin && location.origin.startsWith('http') ? '&origin=' + encodeURIComponent(location.origin) : '';
  const f = document.createElement('iframe');
  f.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&playsinline=1&enablejsapi=1&rel=0&controls=0&modestbranding=1${origin}`;
  f.allow = 'autoplay; encrypted-media; picture-in-picture';
  f.style.cssText = 'width:1280px;height:720px;border:0;pointer-events:none;';
  f.addEventListener('load', () => {
    ytState = -1; ytStuck = 0;
    // 플레이어 상태를 받아보기 위해 등록
    const hello = () => { if (ytFrame === f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); };
    hello(); setTimeout(hello, 500); setTimeout(hello, 1500);
    if (soundOn) setTimeout(() => { ytCmd('unMute'); ytCmd('setVolume', [vidVol]); }, 600);
    ytCmd('playVideo');
  });
  screenDiv.appendChild(f); ytFrame = f;
  screenPlaceholder.visible = false;

}

let ytState = -1, ytStuck = 0;
addEventListener('message', e => {
  if (!ytFrame || e.source !== ytFrame.contentWindow) return;
  let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch { return; }
  if (!d) return;
  if (d.event === 'onStateChange' && typeof d.info === 'number') ytState = d.info;
  else if (d.event === 'infoDelivery' && d.info && typeof d.info.playerState === 'number') ytState = d.info.playerState;
});
setInterval(() => {

  if (ytState === 1 || ytState === 3 || ytState === 0) { ytStuck = 0; return; }   // 0 = 영상 끝남
  ytStuck++;

class Glow {

        void main(){ vC=color; vA=alpha; vec4 mv = modelViewMatrix*vec4(position,1.0); gl_PointSize = size*uPR*(uH*0.9/-mv.z); gl_Position = projectionMatrix*mv; }`,

    });

  }
  emit(p, v, color, size, life, grav = 0, drag = 0) {
    const i = this.i; this.i = (this.i + 1) % this.n;
    this.pos[i * 3] = p.x; this.pos[i * 3 + 1] = p.y; this.pos[i * 3 + 2] = p.z;
    this.vel[i * 3] = v.x; this.vel[i * 3 + 1] = v.y; this.vel[i * 3 + 2] = v.z;
    this.col[i * 3] = color.r; this.col[i * 3 + 1] = color.g; this.col[i * 3 + 2] = color.b;
    this.s0[i] = size; this.size[i] = size; this.life[i] = life; this.max[i] = life; this.alpha[i] = 1; this.grav[i] = grav; this.drag[i] = drag;

      this.life[i] -= dt;

      this.vel[i * 3] *= d; this.vel[i * 3 + 1] = this.vel[i * 3 + 1] * d - this.grav[i] * dt; this.vel[i * 3 + 2] *= d;

      this.alpha[i] = k; this.size[i] = this.s0[i] * (0.3 + 0.7 * k);

  }

const remotes = new Map();   // peerId -> {lion, body, tgt}
function buildPhysics() {
  world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.allowSleep = true;
  world.solver.iterations = 8;
  lionMatP = new CANNON.Material('lion'); candyMatP = new CANNON.Material('candy'); groundMatP = new CANNON.Material('ground');
  world.addContactMaterial(new CANNON.ContactMaterial(lionMatP, groundMatP, { friction: 0, restitution: 0 }));
  world.addContactMaterial(new CANNON.ContactMaterial(lionMatP, candyMatP, { friction: 0, restitution: 0.05 }));
  world.addContactMaterial(new CANNON.ContactMaterial(candyMatP, groundMatP, { friction: 0.7, restitution: 0.12 }));
  world.addContactMaterial(new CANNON.ContactMaterial(candyMatP, candyMatP, { friction: 0.6, restitution: 0.08 }));
  world.addContactMaterial(new CANNON.ContactMaterial(lionMatP, lionMatP, { friction: 0, restitution: 0 }));
  const ground = new CANNON.Body({ mass: 0, material: groundMatP }); ground.addShape(new CANNON.Plane());
  ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0); world.addBody(ground);
  const mount = new CANNON.Body({ mass: 0, material: groundMatP });
  mount.addShape(new CANNON.Cylinder(0.5, POP_R * 0.95, POP_H, 16)); mount.position.set(POPCORN_POS.x, POP_H / 2, POPCORN_POS.z); world.addBody(mount);
  const stage = new CANNON.Body({ mass: 0, material: groundMatP });
  stage.addShape(new CANNON.Box(new CANNON.Vec3((SCREEN_W + 6) / 2, 0.5, 1.1))); stage.position.set(0, 0.5, SCREEN_POS.z - 0.6); world.addBody(stage);
}
function makeMyBody() {
  const b = new CANNON.Body({ mass: 1, material: lionMatP, fixedRotation: true });

  world.addBody(b); return b;
}
function makeRemoteBody() {
  // 원통 모양이라 위가 평평 → 남의 머리 위에 올라설 수 있음
  const b = new CANNON.Body({ mass: 0, material: lionMatP, type: CANNON.Body.KINEMATIC });
  b.addShape(new CANNON.Cylinder(0.42, 0.42, REMOTE_H, 12)); b.allowSleep = false;

}

/* ============================================================
   별사탕 (유성우)

const CANDY_COLORS = ['#ff9ec7', '#ffe066', '#9ff0d0', '#c7b3ff', '#8fd3ff', '#ffb38a', '#ffffff', '#ff7e9e'];
const ICO_DIRS = (() => { const g = new THREE.IcosahedronGeometry(1, 0), p = g.attributes.position, out = []; for (let i = 0; i < p.count; i++) { const v = new THREE.Vector3().fromBufferAttribute(p, i).normalize(); if (!out.some(o => o.distanceTo(v) < 0.01)) out.push(v); } return out; })();
let candyGeo, glowTex;
function buildCandyGeo() {
  let g = new THREE.IcosahedronGeometry(CANDY_R, 6);
  g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    let f = 0; for (const d of ICO_DIRS) { const s = THREE.MathUtils.smoothstep(v.dot(d), 0.84, 1.0); f = Math.max(f, s); }
    v.multiplyScalar(CANDY_R * (1 + 0.42 * Math.pow(f, 1.6)));
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();

}
const candies = new Map();
const removedIds = new Set();
let clearT = 0;
function makeCandyMesh(color) {
  const m = new THREE.Mesh(candyGeo, new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.05, emissive: new THREE.Color(color), emissiveIntensity: 0.55 }));
  m.castShadow = true; m.receiveShadow = true;
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.0 }));
  halo.scale.setScalar(CANDY_R * 4); m.add(halo); m.userData.halo = halo;
  scene.add(m); return m;
}
function makeCandyBody(pos, quat, vel) {
  const b = new CANNON.Body({ mass: 150, material: candyMatP });
  b.addShape(new CANNON.Sphere(CANDY_R * 0.98));
  for (const d of ICO_DIRS) b.addShape(new CANNON.Sphere(CANDY_R * 0.36), new CANNON.Vec3(d.x * CANDY_R * 0.98, d.y * CANDY_R * 0.98, d.z * CANDY_R * 0.98));
  b.position.set(pos.x, pos.y, pos.z);
  if (quat) b.quaternion.set(quat.x, quat.y, quat.z, quat.w);
  if (vel) b.velocity.set(vel.x, vel.y, vel.z);
  b.linearDamping = 0.2; b.angularDamping = 0.85;
  b.allowSleep = true; b.sleepSpeedLimit = 0.35; b.sleepTimeLimit = 0.8;
  world.addBody(b); return b;
}
function spawnMeteor({ id, x, z, c, t, sx, sz }) {
  if (candies.has(id) || removedIds.has(id) || t < clearT) return;
  const target = new THREE.Vector3(x, 15, z);
  const start = new THREE.Vector3(x + sx, 21, z + sz);
  if (start.length() > DOME_R - 3) start.setLength(DOME_R - 3);
  const mesh = makeCandyMesh(c);
  mesh.position.copy(start);
  candies.set(id, { id, c, t, mesh, body: null, state: 'fall', ft: 0, start, target, hits: 0, impacted: false, prevVy: 0, pulse: 0, spin: new THREE.Vector3(rand(-6, 6), rand(-6, 6), rand(-6, 6)) });
  SFX.whoosh(0.8);
  chaosText();
  surprise();
  updateAdminMeta();
}
function addCandyDirect({ id, c, t, p, q, h }) {
  if (candies.has(id) || removedIds.has(id) || t < clearT) return;
  const mesh = makeCandyMesh(c);
  const body = makeCandyBody(new THREE.Vector3(p[0], p[1], p[2]), { x: q[0], y: q[1], z: q[2], w: q[3] });
  const cd = { id, c, t, mesh, body, state: 'phys', hits: h || 0, impacted: true, prevVy: 0, pulse: 0 };
  candies.set(id, cd); syncCandyMesh(cd); updateAdminMeta();
}
function syncCandyMesh(cd) {
  cd.mesh.position.set(cd.body.position.x, cd.body.position.y, cd.body.position.z);
  cd.mesh.quaternion.set(cd.body.quaternion.x, cd.body.quaternion.y, cd.body.quaternion.z, cd.body.quaternion.w);
}
function removeCandy(id, fx = true) {
  const cd = candies.get(id); if (!cd) return;
  candies.delete(id); removedIds.add(id);
  if (fx) {
    burst(cd.mesh.position, 200, { speed: 14, size: 1.0, life: 1.5, colors: [cd.c, '#ffffff', '#ffd84d'] });
    shockRing(cd.mesh.position, 6, new THREE.Color(cd.c).getHex());
    SFX.sparkle(volAt(cd.mesh.position));
    floatText(cd.mesh.position.clone().add(new THREE.Vector3(0, 3, 0)), pick(['파사삭!!', '부서졌다!!', '별사탕 해치움!!']), { size: 34, color: '#ffd84d', life: 1.6 });
    const m = cd.mesh; let k = 0;
    const iv = setInterval(() => { k += 0.08; m.scale.setScalar(Math.max(0, 1 + Math.sin(k * 6) * 0.15 - k)); if (k >= 1) { clearInterval(iv); scene.remove(m); } }, 16);
  } else scene.remove(cd.mesh);

}
function clearAllCandies(t) {
  clearT = Math.max(clearT, t);
  for (const id of [...candies.keys()]) removeCandy(id, true);
}
function updateCandies(dt) {
  for (const cd of candies.values()) {
    const halo = cd.mesh.userData.halo;
    if (cd.state === 'fall') {
      cd.ft += dt;
      const k = Math.min(1, cd.ft / 1.3), e = k * k;
      const prev = cd.mesh.position.clone();
      cd.mesh.position.lerpVectors(cd.start, cd.target, e);
      cd.mesh.rotation.x += cd.spin.x * dt; cd.mesh.rotation.y += cd.spin.y * dt; cd.mesh.rotation.z += cd.spin.z * dt;
      halo.material.opacity = 0.9;
      emitTrail(cd, prev);
      if (k >= 1) {
        const dir = cd.target.clone().sub(cd.start).normalize();
        cd.body = makeCandyBody(cd.target, cd.mesh.quaternion, { x: dir.x * 4, y: -30, z: dir.z * 4 });
        cd.body.angularVelocity.set(cd.spin.x * 0.3, cd.spin.y * 0.3, cd.spin.z * 0.3);
        cd.state = 'phys'; cd.prevVy = -30;
      }
    } else {
      const b = cd.body, r = Math.hypot(b.position.x, b.position.z), lim = PLAY_R - CANDY_R;
      if (r > lim) { const s = lim / r; b.position.x *= s; b.position.z *= s; b.velocity.x *= -0.3; b.velocity.z *= -0.3; }
      if (b.position.z < SCREEN_POS.z + 4.5) { b.position.z = SCREEN_POS.z + 4.5; b.velocity.z = Math.abs(b.velocity.z) * 0.3; }
      if (b.position.y < -5) { b.position.y = 10; b.velocity.set(0, 0, 0); }
      const prevMesh = cd.mesh.position.clone();
      syncCandyMesh(cd);
      if (!cd.impacted) {
        emitTrail(cd, prevMesh);
        if (b.velocity.y > cd.prevVy + 10 || b.position.y < CANDY_R + 0.6) { cd.impacted = true; impact(cd); }
        cd.prevVy = b.velocity.y;
      }
      halo.material.opacity = Math.max(0.1, halo.material.opacity - dt * 0.8);
    }
    if (cd.pulse > 0) {
      cd.pulse = Math.max(0, cd.pulse - dt * 5);
      const s = 1 - Math.sin(cd.pulse * Math.PI) * 0.08;
      cd.mesh.scale.set(1 / Math.sqrt(s), s, 1 / Math.sqrt(s));
    }
  }
}
function emitTrail(cd, prev) {
  const p = cd.mesh.position, n = 10;
  for (let i = 0; i < n; i++) {
    _v.lerpVectors(prev, p, i / n).add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)));
    glow.emit(_v, new THREE.Vector3(rand(-1, 1), rand(0, 1.5), rand(-1, 1)), _c.setHSL(Math.random(), 0.9, 0.7), rand(1, 2.2), rand(0.7, 1.3), -1, 0.5);
  }
  glow.emit(p, new THREE.Vector3(), _c.set(cd.c), 6, 0.25, 0, 0);
}
let shake = 0;
function impact(cd) {
  const p = cd.mesh.position.clone();
  SFX.boom(volAt(p));
  shockRing(p, 9, new THREE.Color(cd.c).getHex()); shockRing(p, 5.5, 0xffffff);
  burst(new THREE.Vector3(p.x, 1, p.z), 220, { speed: 14, size: 1.0, life: 1.3, grav: 10, colors: [cd.c, '#ffffff', '#ffd84d', '#ff7eb6', '#7cc7ff'] });
  for (let i = 0; i < 18; i++) crumbs.emit(new THREE.Vector3(p.x + rand(-2, 2), 0.5, p.z + rand(-2, 2)), new THREE.Vector3(rand(-6, 6), rand(5, 11), rand(-6, 6)), 1.5, rand(1.2, 2));
  if (myLion) {
    const d = p.distanceTo(myLion.root.position);
    shake = Math.max(shake, clamp(1.3 - d / 20, 0, 1.1));
    if (d < 7 && myBody) {
      mySeat = null;
      const away = myLion.root.position.clone().sub(p).setY(0).normalize();
      myBody.velocity.set(away.x * 7, 8, away.z * 7);
      floatText(myLion.root.position.clone().add(new THREE.Vector3(0, 2.4, 0)), pick(['으악!!', '꺄악!', '뭐야뭐야!!']), { size: 26, color: '#ff7eb6' });
    }
  }
}
function hitCandy(id, fromMe) {
  const cd = candies.get(id); if (!cd || !cd.body) return;
  cd.hits++; cd.pulse = 1;
  const p = cd.mesh.position;
  if (cd.hits >= MAX_HITS) { removeCandy(id, true); return; }

    floatText(p.clone().add(new THREE.Vector3(rand(-1.5, 1.5), CANDY_R + rand(0.5, 2), rand(-1.5, 1.5))), pick(['퍽!', '퍽퍽!', '빡!', '퍼억!', '딱!', '깡!']), { size: rand(24, 36), color: pick(['#ffffff', '#ffd84d', '#ff7eb6', '#7cc7ff']) });

/* ============================================================
   네트워크 (공개 MQTT 중계소 경유 – 서버 비용 0원, 휴대폰 데이터에서도 연결)
   ============================================================ */
let room = null;
const selfId = 'p' + Math.random().toString(36).slice(2, 11);
const peers = new Map();
const A = {}, handlers = {}, lastSeen = new Map(), seen = new Set(), seenQ = [];
const clients = [];
let seq = 0;
['hello', 'mv', 'act', 'met', 'hit', 'clr', 'vid', 'st', 'cs', 'bye'].forEach(n => A[n] = { on: fn => handlers[n] = fn });
function send(name, d, target) {
  if (!room) return;
  const msg = JSON.stringify({ k: name, f: selfId, s: ++seq, d });
  const topic = target ? `${TOPIC}/to/${target}` : `${TOPIC}/all`;
  for (const c of clients) if (c.connected) { try { c.publish(topic, msg, { qos: 0 }); } catch {} }
}
function onNetMessage(topic, buf) {
  let m; try { m = JSON.parse(typeof buf === 'string' ? buf : new TextDecoder().decode(buf)); } catch { return; }
  if (!m || typeof m.f !== 'string' || m.f === selfId || typeof m.k !== 'string') return;
  const key = m.f + ':' + m.s;              // 두 중계소에서 같은 메시지가 두 번 오니까 한 번만 처리
  if (seen.has(key)) return;
  seen.add(key); seenQ.push(key); if (seenQ.length > 4000) seen.delete(seenQ.shift());
  if (m.k === 'bye') { lastSeen.delete(m.f); dropPeer(m.f); return; }
  const isNew = !lastSeen.has(m.f);
  lastSeen.set(m.f, performance.now());
  if (isNew) onPeerJoin(m.f);
  const h = handlers[m.k]; if (h) { try { h(m.d, m.f); } catch (e) { console.warn(e); } }
}
function onPeerJoin(pid) {
  send('hello', myHello(), pid);
  // 새로 들어온 사람을 뺀 나머지 중 대표(관리자 우선)가 현재 상태를 넘겨줌
  setTimeout(() => { if (authorityId(pid) === selfId) send('st', fullState(), pid); }, 900);
}
function myHello() { return { n: myNick, a: isAdmin, l: myLook }; }
function isPeerAdmin(pid) { const p = peers.get(pid); return !!(p && p.a); }
function authorityId(exclude) {
  const ids = [{ id: selfId, a: isAdmin }];
  for (const [id, p] of peers) if (id !== exclude) ids.push({ id, a: !!p.a });
  ids.sort((x, y) => (y.a - x.a) || (x.id < y.id ? -1 : 1));
  return ids[0].id;
}
const amAuthority = () => authorityId() === selfId;
function fullState() {
  const cs = [];
  for (const cd of candies.values()) if (cd.body) {
    const b = cd.body;
    cs.push({ id: cd.id, c: cd.c, t: cd.t, h: cd.hits, p: [b.position.x, b.position.y, b.position.z], q: [b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w] });
  }
  return { vid: currentVid, clr: clearT, cs, rm: [...removedIds].slice(-300) };
}
function applyState(s) {
  if (!s) return;
  if (s.clr && s.clr > clearT) clearAllCandies(s.clr);
  (s.rm || []).forEach(id => { if (candies.has(id)) removeCandy(id, false); removedIds.add(id); });
  (s.cs || []).forEach(c => {
    if (candies.has(c.id)) { const cd = candies.get(c.id); cd.hits = Math.max(cd.hits, c.h || 0); }
    else addCandyDirect(c);
  });
  if (s.vid && s.vid.t > currentVid.t) { currentVid = s.vid; setVideo(currentVid.url); }
}
async function initNet() {
  let mqtt;
  try { mqtt = (await import('mqtt')).default; }
  catch (e) { console.warn('mqtt load failed', e); setNet('🔌 오프라인 (혼자 보는 중)'); return; }
  const will = { topic: `${TOPIC}/all`, payload: JSON.stringify({ k: 'bye', f: selfId, s: -1 }), qos: 0, retain: false };
  for (const url of BROKERS) {
    let c;
    try { c = mqtt.connect(url, { clientId: 'knku07_' + selfId + '_' + clients.length, keepalive: 30, reconnectPeriod: 3000, connectTimeout: 8000, clean: true, will }); }
    catch (e) { console.warn(e); continue; }
    clients.push(c);
    c.on('connect', () => {
      c.subscribe([`${TOPIC}/all`, `${TOPIC}/to/${selfId}`], { qos: 0 });
      room = true; setNet(); send('hello', myHello());
    });
    c.on('message', onNetMessage);
    c.on('close', () => { if (!clients.some(x => x.connected)) { room = null; setNet('🔌 중계소 다시 연결 중…'); } });
    c.on('error', e => console.warn('mqtt', url, e && e.message));
  }
  A.hello.on((d, pid) => {
    const isNew = !peers.has(pid);
    peers.set(pid, { n: String(d.n || '사자').slice(0, 12), a: !!d.a, l: fixLook(d.l) });
    const P = peers.get(pid);
    let r = remotes.get(pid);
    if (!r) {
      const lion = new Lion(P.l, P.n, P.a);
      const body = makeRemoteBody(); body.position.set(0, -50, 0);
      r = { lion, body, tgt: null, look: JSON.stringify(P.l) }; remotes.set(pid, r);
    } else if (r.look !== JSON.stringify(P.l)) {
      const pos = r.lion.root.position.clone(); r.lion.dispose();
      r.lion = new Lion(P.l, P.n, P.a); r.lion.root.position.copy(pos); r.look = JSON.stringify(P.l);
    } else r.lion.setName(P.n, P.a);
    if (isNew) toast(`🦁 ${P.n} 님이 들어왔어요!`, 2200);
    refreshNames();
  });
  A.mv.on((d, pid) => {
    const r = remotes.get(pid); if (!r || !Array.isArray(d)) return;
    r.tgt = d;
    if (r.lion.bites !== d[5] || r.lion.isGiant !== !!d[7]) r.lion.setBites(d[5], !!d[7]);
  });
  A.act.on((d, pid) => {
    const r = remotes.get(pid); if (!r) return;
    const v = volAt(r.lion.root.position);
    if (d.a === 'eat') { r.lion.eat(); setTimeout(() => SFX.crunch(v * 0.6), 300); setTimeout(() => popcornSpray(r.lion, r.lion.isGiant), 300); }
    else if (d.a === 'whack') { r.lion.whack(); if (typeof d.f === 'number') r.lion.facing = d.f; }
    else if (d.a === 'refill') { r.lion.refill(); SFX.refill(v * 0.5); r.lion.setBites(d.g ? 10 : 3, !!d.g); }
    else if (d.a === 'empty') { r.lion.empty(); }
  });
  A.hit.on(d => hitCandy(d.id, false));
  A.met.on((d, pid) => { if (isPeerAdmin(pid)) spawnMeteor(d); });
  A.clr.on((d, pid) => { if (isPeerAdmin(pid)) clearAllCandies(d.t); });
  A.vid.on((d, pid) => { if (isPeerAdmin(pid) && d.t > currentVid.t) { currentVid = d; setVideo(d.url); } });
  A.st.on(d => applyState(d));
  A.cs.on((d, pid) => {
    if (pid !== authorityId() || amAuthority()) return;
    for (const s of d) {
      const cd = candies.get(s[0]); if (!cd || !cd.body) continue;
      const b = cd.body;
      const dx = s[1] - b.position.x, dy = s[2] - b.position.y, dz = s[3] - b.position.z;
      const err = Math.hypot(dx, dy, dz);
      if (err < 0.12 && b.sleepState === CANNON.Body.SLEEPING) continue;
      const k = err > 4 ? 1 : 0.5;
      b.position.x += dx * k; b.position.y += dy * k; b.position.z += dz * k;
      b.quaternion.slerp(new CANNON.Quaternion(s[4], s[5], s[6], s[7]), k, b.quaternion);
      b.velocity.set(s[8], s[9], s[10]);
      if (s[11] > cd.hits) cd.hits = s[11];
      b.wakeUp();
    }
  });
  A.bye.on((d, pid) => dropPeer(pid));
  setInterval(() => send('hello', myHello()), 4000);
  // 오래 소식 없는 사람 정리 (창을 그냥 닫은 경우 대비)
  setInterval(() => { const t = performance.now(); for (const [pid, ts] of lastSeen) if (t - ts > 75000) { lastSeen.delete(pid); dropPeer(pid); } }, 5000);
  setTimeout(() => { if (!room) setNet('🔌 연결이 안 돼요 (새로고침 해봐요)'); }, 12000);
  window.addEventListener('beforeunload', () => { try { send('bye', 1); clients.forEach(c => c.end(true)); } catch {} });
}
function dropPeer(pid) {
  const r = remotes.get(pid);
  if (r) { r.lion.dispose(); world.removeBody(r.body); remotes.delete(pid); }
  const p = peers.get(pid); peers.delete(pid);
  if (p) toast(`👋 ${p.n} 님이 나갔어요`, 2200);
  refreshNames();
}
function setNet(text) {
  if (text) { $('netStatus').textContent = text; return; }
  const n = peers.size + 1;
  $('netStatus').textContent = room ? (n > 1 ? `🟢 같이 보는 중 · ${n}명` : '🟡 친구 찾는 중… (혼자 1명)') : '🔌 오프라인';
}
function refreshNames() {
  setNet();
  const list = [`${isAdmin ? '👑' : '🦁'} ${myNick} (나)`];
  for (const p of peers.values()) list.push(`${p.a ? '👑' : '🦁'} ${p.n}`);
  $('names').innerHTML = '';
  list.forEach(s => { const d = document.createElement('div'); d.textContent = s; $('names').appendChild(d); });
  updateAdminMeta();
}

   UI 헬퍼

function updateFloaters(dt) {

    if (f.t > f.life) { f.el.remove(); floaters.splice(i, 1); continue; }

    f.el.style.transform = `translate(${(_pp.x * 0.5 + 0.5) * W}px,${(-_pp.y * 0.5 + 0.5) * H}px) translate(-50%,-50%) scale(${sc}) rotate(${f.rot}deg)`;

}

let netT = 0, syncT = 0, fullSyncT = 0, wasAir = false, lastMv = '';
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _move = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  // --- 내 사자 이동 ---
  _fwd.set(-Math.sin(camYaw), 0, -Math.cos(camYaw));
  _right.set(Math.cos(camYaw), 0, -Math.sin(camYaw));
  _move.set(0, 0, 0);
  if (keys.KeyW || keys.ArrowUp) _move.add(_fwd);
  if (keys.KeyS || keys.ArrowDown) _move.sub(_fwd);
  if (keys.KeyD || keys.ArrowRight) _move.add(_right);
  if (keys.KeyA || keys.ArrowLeft) _move.sub(_right);
  if (joy.active) _move.addScaledVector(_right, joy.x).addScaledVector(_fwd, -joy.y);
  const mlen = Math.min(1, _move.length());
  if (mlen > 0.01) _move.normalize().multiplyScalar(mlen);
  const running = keys.ShiftLeft || keys.ShiftRight || (joy.active && Math.hypot(joy.x, joy.y) > 0.95);
  const SPEED = running ? 11 : 6.5;
  if (mySeat && (mlen > 0.1 || jumpQueued)) mySeat = null;   // 움직이면 일어남
  let carryX = 0, carryZ = 0;
  if (groundBody && groundBody.type === CANNON.Body.KINEMATIC) { carryX = groundBody.velocity.x; carryZ = groundBody.velocity.z; }
  const accel = grounded ? 14 : 5;
  myBody.velocity.x += (_move.x * SPEED + carryX - myBody.velocity.x) * Math.min(1, accel * dt);
  myBody.velocity.z += (_move.z * SPEED + carryZ - myBody.velocity.z) * Math.min(1, accel * dt);
  if (jumpQueued) { if (grounded) { myBody.velocity.y = 9; SFX.bloop(0.4); } jumpQueued = false; }

  // 원격 사자들 (키네마틱 원통)
  for (const r of remotes.values()) {
    if (!r.tgt) continue;
    const L = r.lion.root.position, d = r.tgt;
    const k = 1 - Math.exp(-12 * dt);
    const ox = L.x, oz = L.z;
    L.x += (d[0] - L.x) * k; L.y += (d[1] - L.y) * k; L.z += (d[2] - L.z) * k;
    let df = d[3] - r.lion.facing; df = Math.atan2(Math.sin(df), Math.cos(df)); r.lion.facing += df * k;
    r.lion.speed = d[4]; r.lion.air = !!d[6]; r.lion.sit = !!d[8];
    r.body.position.set(L.x, L.y + REMOTE_H / 2 - (r.lion.sit ? 0.2 : 0), L.z);
    r.body.velocity.set((L.x - ox) / Math.max(dt, 1e-3), 0, (L.z - oz) / Math.max(dt, 1e-3));
  }

  world.step(1 / 60, dt, 4);

  grounded = false; groundBody = null;
  for (const c of world.contacts) {
    if (c.bi === myBody && c.ni.y < -0.5) { grounded = true; groundBody = c.bj; }
    else if (c.bj === myBody && c.ni.y > 0.5) { grounded = true; groundBody = c.bi; }
  }
  if (myBody.position.y < LION_R + 0.02) grounded = true;
  if (mySeat) {
    myBody.position.set(mySeat.pos.x, 0.21 + LION_R, mySeat.pos.z);
    myBody.velocity.set(0, 0, 0); grounded = true; myLion.facing = Math.PI;
  }
  const pr = Math.hypot(myBody.position.x, myBody.position.z);
  if (pr > PLAY_R) { myBody.position.x *= PLAY_R / pr; myBody.position.z *= PLAY_R / pr; }
  if (myBody.position.z < SCREEN_POS.z + 2.4) myBody.position.z = SCREEN_POS.z + 2.4;
  if (myBody.position.y < -3) myBody.position.set(0, 2, 0);

  myLion.root.position.set(myBody.position.x, myBody.position.y - LION_R, myBody.position.z);
  const hsp = mySeat ? 0 : Math.hypot(myBody.velocity.x - carryX, myBody.velocity.z - carryZ);
  myLion.speed = hsp; myLion.air = !grounded; myLion.sit = !!mySeat;
  if (hsp > 0.4 && myLion.whackT < 0) {
    const want = Math.atan2(myBody.velocity.x - carryX, myBody.velocity.z - carryZ);
    let df = want - myLion.facing; df = Math.atan2(Math.sin(df), Math.cos(df)); myLion.facing += df * Math.min(1, 12 * dt);
  }
  if (wasAir && grounded) myLion.land = 1;
  wasAir = !grounded;
  myLion.update(dt);
  for (const r of remotes.values()) r.lion.update(dt);

  updateCandies(dt);

  // --- 네트워크 송신 ---
  netT += dt;
  const mvNow = [myLion.root.position.x, myLion.root.position.y, myLion.root.position.z, myLion.facing, bites, giantPop, mySeat].map(String).join('|');
  if (room && (netT > 1 || (netT > 1 / 8 && mvNow !== lastMv))) {
    netT = 0; lastMv = mvNow;
    const L = myLion.root.position;
    send('mv', [+L.x.toFixed(2), +L.y.toFixed(2), +L.z.toFixed(2), +myLion.facing.toFixed(2), +hsp.toFixed(1), bites, grounded ? 0 : 1, giantPop ? 1 : 0, mySeat ? 1 : 0]);
  }
  if (room && amAuthority() && peers.size) {
    syncT += dt; fullSyncT += dt;
    if (syncT > 0.25) {
      const all = fullSyncT > 3; if (all) fullSyncT = 0; syncT = 0;
      const arr = [];
      for (const cd of candies.values()) {
        if (!cd.body) continue;
        const b = cd.body;
        if (!all && b.sleepState === CANNON.Body.SLEEPING) continue;
        arr.push([cd.id, +b.position.x.toFixed(3), +b.position.y.toFixed(3), +b.position.z.toFixed(3), +b.quaternion.x.toFixed(4), +b.quaternion.y.toFixed(4), +b.quaternion.z.toFixed(4), +b.quaternion.w.toFixed(4), +b.velocity.x.toFixed(2), +b.velocity.y.toFixed(2), +b.velocity.z.toFixed(2), cd.hits]);
      }
      if (arr.length) send('cs', arr);
    }
  }

  // --- 카메라 (하늘이 더 보이게 위쪽을 바라봄) ---
  const tgt = myLion.root.position.clone().add(new THREE.Vector3(0, 1.3, 0));
  const off = new THREE.Vector3(Math.sin(camYaw) * Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw) * Math.cos(camPitch)).multiplyScalar(camDist);
  camera.position.copy(tgt).add(off);
  if (camera.position.y < 0.3) camera.position.y = 0.3;
  if (camera.position.length() > DOME_R - 1) camera.position.setLength(DOME_R - 1);
  if (shake > 0) { camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * 0.4)); shake = Math.max(0, shake - dt * 1.8); }
  camera.lookAt(tgt.x, tgt.y + LOOK_UP, tgt.z);

  // --- 이펙트 ---
  glow.update(dt); crumbs.update(dt);
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt;
    const k = r.t / 0.9; r.m.scale.setScalar(1 + k * r.maxR); r.m.material.opacity = Math.max(0, 0.9 * (1 - k));
    if (k >= 1) { scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); rings.splice(i, 1); }
  }
  updateMiniMeteors(dt);
  starMat.uniforms.uTime.value = time;
  fireflies.material.uniforms.uTime.value = time;
  if (grassMat.userData.sh) grassMat.userData.sh.uniforms.uTime.value = time;
  twinkles.forEach(t => t.s.scale.setScalar(t.base * (0.85 + 0.25 * Math.sin(time * 2 + t.ph))));
  bulbs.forEach((b, i) => b.material.color.setHex(((i + Math.floor(time * 4)) % 3 === 0) ? 0xffffff : 0xffc94d));
  screenLight.intensity = 0.8 + Math.sin(time * 7) * 0.05 + Math.random() * 0.05;
  popSign.position.y = POP_H + 1.1 + Math.sin(time * 2.5) * 0.15;
  updateFloaters(dt);

  renderer.render(scene, camera);
  cssRenderer.render(cssScene, camera);
}

window.__meteor = { get candies() { return candies; }, get lion() { return myLion; }, spawn: () => $('meteorBtn').click() };
</script>
